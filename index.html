<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezeptkartei</title>
<meta name="description" content="Rezepte aus Screenshots sammeln, in Vorlagen eintragen und als A5 drucken.">
<meta name="theme-color" content="#FCF5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Courier+Prime:wght@400;700&family=Dancing+Script:wght@600;700&family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Zilla+Slab:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: Pinnwand — Suchleiste, Kategorie-Pillen, Rezepte als Masonry-Pins; Vorlagen als echtes Papierblatt */
:root{
  --bg:#FCF5F4; --surface:#FFFFFF; --surface-2:#F7E7E8; --ink:#3B2530; --muted:#8C6E7A; --line:#F0DADF;
  --accent:#C4547A; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA; --danger:#B0383E; --danger-soft:#FBE4E3;
  --good:#3C8A5A; --chip-s:72%; --chip-l:90%; --tint-s:60%; --tint-l:90%; --tint-ink:34%;
  --f-display:'Playfair Display', Georgia, serif;
  --f-script:'Dancing Script', 'Brush Script MT', cursive;
  --f-body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Nunito', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1418; --surface:#291D22; --surface-2:#35262D; --ink:#F7E8ED; --muted:#C4A4B1; --line:#47333D;
  --accent:#F29AB7; --accent-ink:#2B1019; --accent-soft:#4A2635; --danger:#F0908A; --danger-soft:#47231F;
  --good:#86CFA0; --chip-s:32%; --chip-l:28%; --tint-s:30%; --tint-l:26%; --tint-ink:84%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1D1418; --surface:#291D22; --surface-2:#35262D; --ink:#F7E8ED; --muted:#C4A4B1; --line:#47333D;
  --accent:#F29AB7; --accent-ink:#2B1019; --accent-soft:#4A2635; --danger:#F0908A; --danger-soft:#47231F;
  --good:#86CFA0; --chip-s:32%; --chip-l:28%; --tint-s:30%; --tint-l:26%; --tint-ink:84%; color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
.topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-script);font-weight:700;font-size:31px;line-height:1;color:var(--accent);margin-right:auto}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main.wrap{padding-block:22px 80px}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px rgba(196,84,122,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted);font-size:12.5px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;line-height:1.5}
select.inp{padding-right:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.h1{font-family:var(--f-display);font-style:italic;font-size:32px;font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0}
.note{background:var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--danger-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}

/* Bibliothek */
.lib{display:flex;flex-direction:column;gap:16px}
.catnav{display:flex;flex-wrap:wrap;gap:8px}
.catnav .lbl{display:none}
.catbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.catbtn:hover{border-color:var(--accent)}
.catbtn[aria-current="true"]{background:hsl(var(--h) var(--chip-s) var(--chip-l));border-color:hsl(var(--h) 50% 70%)}
.catbtn.all[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.catbtn .dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 62% 68%)}
.catbtn .n{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.catbtn.all[aria-current="true"] .n{color:inherit}
.libbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.libbar .inp{max-width:380px;flex:1 1 220px;border-radius:999px;padding-left:16px}
.libbar select.inp{flex:none;width:auto;max-width:none}
.card-c{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card-c i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 62% 68%)}
.group{margin-bottom:30px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.group-h .h2{display:flex;align-items:center;gap:10px;font-style:italic;font-size:24px}
.group-h .h2 i{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 62% 68%);display:inline-block}
.group-h .muted{font-size:13px;font-weight:700}
.cards{columns:4 190px;column-gap:18px}
.card{display:inline-flex;flex-direction:column;width:100%;margin:0 0 20px;break-inside:avoid;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;min-width:0}
.thumb{width:100%;aspect-ratio:var(--ar,3/4);border-radius:20px;background-color:hsl(var(--h) var(--chip-s) var(--chip-l));background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;transition:transform .2s ease, box-shadow .2s ease}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 26px -14px rgba(140,50,80,.45)}
.thumb b{font-family:var(--f-script);font-size:30px;line-height:1.1;text-align:center;font-weight:700;color:hsl(var(--h) 45% var(--tint-ink));overflow-wrap:break-word;hyphens:auto;min-width:0}
.badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.card-b{padding:8px 4px 0;display:flex;flex-direction:column;gap:1px;min-width:0}
.card-t{font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.card-m{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:24px;background:var(--surface)}
.empty .h2{margin-bottom:6px;font-style:italic}

/* Vorschau */
.preview{background:var(--surface-2);border-radius:22px;padding:20px;overflow:hidden;min-width:0;position:relative}
.pv-frame{position:relative;margin:0 auto}
.pv-scale{transform-origin:0 0;width:max-content;box-shadow:0 1px 2px rgba(80,20,40,.10),0 12px 32px -6px rgba(120,40,70,.22)}
.pb{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(200,60,40,.55);pointer-events:none}
.pb span{position:absolute;right:6px;top:-22px;font:600 11px/1 var(--f-body);color:#b4412b;background:#fff;padding:3px 6px;border-radius:4px}
.pv-label{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Detail */
.dbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);border-radius:16px;padding:10px 14px;margin-bottom:14px}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.shots button{border:1px solid var(--line);padding:0;border-radius:12px;overflow:hidden;background:var(--surface);cursor:zoom-in;flex:none}
.shots img{display:block;height:150px;width:auto;max-width:none}
details.orig{margin-top:18px}
details.orig summary{cursor:pointer;font-weight:600;margin-bottom:10px}

/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.ed-form{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-side{position:sticky;top:80px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.fs{border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface);margin:0;min-width:0}
.fs legend{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:19px;padding:0 6px;color:var(--accent)}
.photo-ed{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-ed .ph{width:120px;aspect-ratio:4/3;border-radius:8px;background:var(--surface-2);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}

/* Hochladen */
.up{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.drop{border:2px dashed var(--accent);border-radius:24px;padding:34px 16px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .h2{margin-bottom:4px}
.files{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fi{width:132px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);position:relative}
.fi img{display:block;width:100%;height:170px;object-fit:cover;object-position:top}
.fi .num{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font:800 12px/1 var(--f-body);padding:4px 7px;border-radius:999px}
.fi .ctl{display:flex;justify-content:space-between;padding:4px}
.status{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.card:hover{transform:none}}
.steps-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.steps-h b{font-family:var(--f-body);font-weight:800;font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}

/* Vorlagen */
.tv{display:grid;grid-template-columns:210px 400px minmax(0,1fr);gap:22px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:4px}
.titem{display:flex;flex-direction:column;align-items:flex-start;border:1px solid transparent;background:transparent;border-radius:16px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.titem:hover{background:var(--surface-2)}
.titem[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.titem b{display:flex;align-items:center;gap:8px}
.titem i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.titem small{color:var(--muted);font-size:12px}
.tform{display:flex;flex-direction:column;gap:14px;min-width:0}
.secrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 8px;border-radius:14px;background:var(--surface-2)}
.secrow.off{opacity:.62}
.secrow .inp{padding:6px 8px}
.secrow .mv{display:flex;gap:2px}
.secrow .hint{grid-column:2/-1}
.secrow select.inp{width:auto}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:14px;line-height:1}
.ib:hover{border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.catrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.catrow i{width:14px;height:14px;border-radius:50%;background:hsl(var(--h) 62% 68%)}

/* Was hab ich da? */
.pantry{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
.pantry aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:8px}
.chipbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 4px 3px 12px;font-weight:700;font-size:14px}
.chip button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:12px;line-height:1;padding:0}
.chip button:hover{background:var(--surface);color:var(--ink)}
.chipbox input{border:0;outline:0;background:transparent;flex:1 1 120px;min-width:100px;padding:6px 4px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pres{display:flex;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:10px;cursor:pointer;min-width:0}
.pres:hover{border-color:var(--accent)}
.pres-th{flex:0 0 88px;height:116px;border-radius:14px;background-color:hsl(var(--h) var(--chip-s) var(--chip-l));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:6px}
.pres-th b{font-family:var(--f-script);font-size:17px;line-height:1.05;text-align:center;color:hsl(var(--h) 45% var(--tint-ink));overflow-wrap:break-word;hyphens:auto;min-width:0}
.pres-b{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.full span{background:var(--good)}
.pres-n{font-size:13px;font-weight:700;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;align-items:center;color:var(--muted)}
.miss em{font-style:normal;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink)}
.allok{font-size:13px;font-weight:800;color:var(--good)}
.ptip{font-family:'Caveat',cursive;font-size:18px;line-height:1.2;color:var(--accent);margin:0}
@media (max-width:900px){.pantry{grid-template-columns:1fr}.pantry aside{position:static}}

/* Navigation unten am Handy */
.tab svg{display:none}
.tab .ts{display:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer;font-size:inherit}
.sheet-ov{position:fixed;inset:0;z-index:80;background:rgba(30,10,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bsheet{background:var(--surface);border-radius:24px;padding:20px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px -20px rgba(80,20,40,.5)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.setgrid .panel{display:flex;flex-direction:column;gap:12px}
.okline{color:var(--good);font-weight:800;font-size:14px}
.errline{color:var(--danger);font-weight:700;font-size:14px}
#printHost{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printHost){display:none!important}
  #printHost{display:block}
  #printHost img{display:block;max-width:none;margin:0}
  #printHost img:not(:last-child){break-after:page;page-break-after:always}
}
@media (max-width:700px){
  .topbar .wrap{padding-block:8px}
  .brand{font-size:27px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:800}
  .tab svg{display:block;width:23px;height:23px}
  .tab .tl{display:none}
  .tab .ts{display:inline;white-space:nowrap}
  .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  main.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sheet-ov{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* Sync */
main a{color:var(--accent)}
.syncpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;order:2}
.syncpill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncpill.ok i{background:var(--good)}
.syncpill.busy i{background:#D9A03A}
.syncpill.err i{background:var(--danger)}
.syncpill.err{color:var(--danger)}
.codebox{font:800 22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--accent-soft);border-radius:14px;padding:12px 14px;text-align:center;overflow-wrap:anywhere}
@media (max-width:700px){.syncpill span{display:none}.syncpill{padding:8px}}

/* Titelschriften */
.sheet.tf-script .sh-title{font-family:'Dancing Script','Brush Script MT',cursive!important;font-style:normal!important;font-weight:700!important;letter-spacing:0}
.sheet.tf-serif .sh-title{font-family:'Playfair Display',Georgia,serif!important;font-style:italic!important;font-weight:600!important;letter-spacing:0}
.sheet.tf-sans .sh-title{font-family:'Nunito',Arial,sans-serif!important;font-style:normal!important;font-weight:800!important;letter-spacing:-.01em}
.sheet.tf-slab .sh-title{font-family:'Zilla Slab',Rockwell,Georgia,serif!important;font-style:normal!important;font-weight:700!important}
.sheet.tf-hand .sh-title{font-family:'Caveat',cursive!important;font-style:normal!important;font-weight:600!important;font-size:2.9em;letter-spacing:0}
.refimg{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.refimg button{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:zoom-in;background:var(--surface)}
.refimg img{display:block;height:84px;width:auto}

/* Meldungen */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--danger);color:var(--surface)}
.lightbox{position:fixed;inset:0;background:rgba(10,14,12,.86);z-index:70;display:flex;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{width:min(760px,100%);height:auto;align-self:flex-start;border-radius:8px}
#pdfHost{position:absolute;left:-14000px;top:0;width:auto;pointer-events:none}

@media (max-width:1180px){.tv{grid-template-columns:200px minmax(0,1fr)}.tv .tprev{grid-column:1/-1}}
@media (max-width:900px){.ed,.up{grid-template-columns:1fr}.ed-side{position:static}}
@media (max-width:760px){
  .tv{grid-template-columns:1fr}
  .catnav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .catbtn{flex:none}
  .cards{columns:2 140px;column-gap:12px}
  .thumb b{font-size:24px}
  .tlist{flex-direction:row;overflow-x:auto}
  .titem{width:auto;flex:none}
  .h1{font-size:25px}
  .preview{padding:10px}
}

/* ================= Rezeptblatt (Druckobjekt, feste Papierfarben) ================= */
.sheet{width:var(--pw);min-height:var(--ph);background:#ffffff;color:#24251f;padding:var(--pad);position:relative;font-size:calc(var(--base) * var(--fs));line-height:1.5;text-align:left;font-family:'Figtree',Arial,sans-serif}
.sheet *{box-sizing:border-box}
.sheet p{margin:0}
.sh-head{margin-bottom:1.6em}
.sh-cat{display:inline-block;font-size:.76em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.sh-title{margin:.15em 0 0;font-size:2.35em;line-height:1.12;font-weight:700;letter-spacing:-.01em;color:#1d1e19}
.sh-tags{margin-top:.45em;color:#6d6e64;font-size:.86em}
.sh-sec{margin-bottom:1.35em}
.sh-h{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--acc);margin:0 0 .65em;padding-bottom:.35em;border-bottom:1.5px solid var(--acc-soft)}
.cols{display:grid;grid-template-columns:34% minmax(0,1fr);gap:calc(26px * var(--fs))}
.p-A5q .cols{grid-template-columns:38% minmax(0,1fr)}
.col{min-width:0}
.sh-photo{width:100%;aspect-ratio:16/10;background-size:cover;background-position:center;border-radius:6px;background-color:#eee}
.one .sh-photo{aspect-ratio:21/9}
.sh-intro{font-size:1.08em;color:#45463e}
.sh-meta{display:flex;flex-wrap:wrap;gap:.5em 1.6em;padding:.75em .95em;background:var(--acc-soft);border-radius:6px}
.col-a .sh-meta{flex-direction:column;gap:.45em}
.mi{display:flex;flex-direction:column}
.ml{font-size:.7em;text-transform:uppercase;letter-spacing:.1em;color:#66675e;font-weight:600}
.mv{font-weight:600}
.ing{display:flex;gap:.75em;padding:.24em 0;border-bottom:1px dotted #d6d5cc}
.ing-a{flex:0 0 30%;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.col-a .ing-a{flex-basis:40%}
.ing-i{flex:1;min-width:0}
.ing-g{font-weight:700;margin:.8em 0 .15em;font-size:.93em;color:var(--acc)}
.ing-g:first-child{margin-top:0}
.step{display:flex;gap:.85em;margin-bottom:.7em}
.step-n{flex:0 0 1.85em;height:1.85em;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:.8em;display:flex;align-items:center;justify-content:center;margin-top:.1em}
.step-t{flex:1;min-width:0}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.col-a .nut{grid-template-columns:1fr 1fr}
.nut div{border:1px solid var(--acc-soft);border-radius:6px;padding:.4em .3em;text-align:center;display:flex;flex-direction:column}
.nut b{font-size:1.05em}
.nut small{font-size:.72em;color:#66675e}
.sh-text{white-space:normal}
.notes-line{height:2em;border-bottom:1px solid #cfcfc5}
.sh-src{font-size:.8em;color:#76776c}
/* Stil: Klassisch */
.st-klassisch{font-family:'Lora',Georgia,serif}
.st-klassisch .sh-head{text-align:center;padding-bottom:1em;border-bottom:3px double var(--acc)}
.st-klassisch .sh-title{font-style:italic;font-weight:600;font-size:2.5em}
.st-klassisch .sh-h{border-bottom:0;display:flex;align-items:center;gap:.8em;text-align:center;font-family:'Lora',Georgia,serif;letter-spacing:.22em}
.st-klassisch .sh-h::before,.st-klassisch .sh-h::after{content:"";flex:1;height:1px;background:var(--acc)}
.st-klassisch .step-n{background:transparent;color:var(--acc);font-style:italic;font-size:1em;justify-content:flex-start;width:auto;height:auto;margin-top:0;border-radius:0;flex-basis:1.4em}
.st-klassisch .sh-meta{background:transparent;border-top:1px solid var(--acc-soft);border-bottom:1px solid var(--acc-soft);border-radius:0;justify-content:center}
.st-klassisch .col-a .sh-meta{justify-content:flex-start}
.st-klassisch .ing{border-bottom-style:solid;border-bottom-color:#ebe9e0}
/* Stil: Karteikarte */
.st-karte{font-family:'Courier Prime','Courier New',monospace}
.st-karte .sh-title{font-family:'Zilla Slab',Rockwell,Georgia,serif;font-size:2.2em}
.st-karte .sh-head{border-bottom:2.5px solid var(--acc);padding-bottom:.6em;margin-bottom:1.1em}
.st-karte .rand{position:absolute;top:0;bottom:0;left:calc(var(--pad) * .55);width:1.5px;background:#e7a7a1}
.st-karte .sh-h{font-family:'Zilla Slab',Rockwell,Georgia,serif;font-size:.92em;letter-spacing:.08em;border-bottom-color:#c9d8ea}
.st-karte .ing{border-bottom:1px solid #d5e1ee}
.st-karte .step{border-bottom:1px solid #d5e1ee;padding-bottom:.35em;margin-bottom:.4em}
.st-karte .step-n{background:transparent;color:var(--acc);font-size:1em;width:auto;height:auto;border-radius:0;margin-top:0;justify-content:flex-start;flex-basis:1.8em}
.st-karte .sh-meta{background:transparent;border:1.5px solid var(--acc-soft);border-radius:4px}
.st-karte .notes-line{border-bottom-color:#c9d8ea}

/* gemeinsame Zusätze für die verspielten Stile */
.p-A5 .cols{grid-template-columns:40% minmax(0,1fr)}
.tsep{color:#9a9a90}
.sh-ico{display:inline-flex;width:1.2em;height:1.2em;flex:none}
.sh-ico svg{width:100%;height:100%;display:block}
.st-blush,.st-bogen,.st-pastell{font-family:'Nunito',Arial,sans-serif}
.st-blush .tag,.st-bogen .tag,.st-pastell .tag{display:inline-block;background:#fff;border:1px solid var(--acc-soft);color:var(--acc-deep);border-radius:999px;padding:.08em .75em;font-size:.95em;font-weight:600}
.st-blush .tsep,.st-bogen .tsep,.st-pastell .tsep{display:none}
.st-blush .sh-tags,.st-bogen .sh-tags,.st-pastell .sh-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:.35em;margin-top:.7em}
.st-blush .sh-meta,.st-pastell .sh-meta{background:transparent;padding:0;gap:.45em;justify-content:center}
.st-blush .col-a .sh-meta,.st-pastell .col-a .sh-meta{justify-content:flex-start;flex-direction:row}
.st-blush .mi,.st-bogen .mi,.st-pastell .mi{flex-direction:row;align-items:center;gap:.4em}
.st-blush .ml,.st-bogen .ml,.st-pastell .ml{order:3;text-transform:none;letter-spacing:0;font-size:.82em;font-weight:600;color:#8a7a80}
.st-blush .mv,.st-bogen .mv,.st-pastell .mv{order:2;font-weight:800}
.st-blush .ing,.st-pastell .ing{border:0;padding:.17em 0;align-items:baseline;gap:.55em}
.st-blush .ing-a,.st-bogen .ing-a,.st-pastell .ing-a{flex:0 0 auto;text-align:left;color:var(--acc-deep);font-weight:800}
.st-blush .ing-a:empty,.st-bogen .ing-a:empty,.st-pastell .ing-a:empty{display:none}
.one.st-blush .ings,.one.st-pastell .ings{display:grid;grid-template-columns:1fr 1fr;column-gap:1.6em}
.st-blush .ing-g,.st-bogen .ing-g,.st-pastell .ing-g{grid-column:1/-1;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:1.05em;color:var(--acc-deep)}
.sh-tipbox .sh-text{white-space:normal}
.st-blush .sh-tipbox .sh-text,.st-bogen .sh-tipbox .sh-text,.st-pastell .sh-tipbox .sh-text{font-family:'Caveat',cursive;font-size:1.5em;line-height:1.2;color:#54404a}
.st-blush .nut div,.st-bogen .nut div,.st-pastell .nut div{border:0;background:var(--acc-pale);border-radius:.9em}
.st-bogen .nut div{background:#fff}

/* Stil: Blush */
.st-blush{color:#4a3a41}
.st-blush .sh-head{margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 1.5em;padding:calc(var(--pad) * .95) var(--pad) 1.6em;background:var(--acc-pale);text-align:center;border-radius:0 0 50% 50% / 0 0 2.4em 2.4em}
.st-blush .sh-cat{color:var(--acc-deep);letter-spacing:.26em;font-weight:800;font-size:.68em}
.st-blush .sh-title{font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;font-size:3.3em;line-height:1.02;letter-spacing:0;color:var(--acc-deep);margin-top:.12em}
.st-blush .sh-photo{border-radius:1.4em;box-shadow:0 .6em 1.3em -.7em rgba(90,30,55,.45)}
.st-blush.one .sh-photo{aspect-ratio:16/10}
.st-blush .mi{background:var(--acc-pale);border-radius:999px;padding:.32em .9em .32em .7em}
.st-blush .sh-h{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:1.5em;letter-spacing:0;text-transform:none;color:var(--acc-deep);border:0;padding:0;margin:0 0 .4em}
.st-blush .sh-h::after{content:"";display:block;width:2.2em;height:.2em;border-radius:1em;background:var(--acc);opacity:.45;margin-top:.12em}
.st-blush .ing::before{content:"";flex:0 0 .42em;height:.42em;border-radius:50%;background:var(--acc);transform:translateY(-.12em)}
.st-blush .step-n{background:var(--acc-soft);color:var(--acc-deep);font-weight:800}
.st-blush .sh-tipbox{background:var(--acc-pale);border-radius:1.3em;padding:.9em 1.1em}
.st-blush .sh-tipbox .sh-h::after{display:none}
.st-blush .sh-src{text-align:center}
.st-blush .notes-line{border-bottom:1.5px dotted var(--acc)}

/* Stil: Bogen (Salbei) */
.st-bogen{background:var(--acc-pale);color:#3d3a37}
.st-bogen .sh-head{text-align:center;margin-bottom:1.3em}
.st-bogen .sh-cat{color:var(--acc-deep);letter-spacing:.32em;font-size:.66em;font-weight:800}
.st-bogen .sh-title{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:2.6em;color:var(--acc-deep);letter-spacing:0}
.st-bogen .sh-photo{border-radius:999px 999px 1em 1em;aspect-ratio:3/4;border:.35em solid #fff}
.st-bogen.one .sh-photo{aspect-ratio:16/10;border-radius:14em 14em 1em 1em}
.st-bogen .sh-meta{background:#fff;border-radius:1em;justify-content:center;padding:.7em .9em}
.st-bogen .col-a .sh-meta{justify-content:flex-start}
.st-bogen .sh-h{font-family:'Nunito',Arial,sans-serif;font-weight:800;font-size:.7em;letter-spacing:.28em;color:var(--acc-deep);border:0;display:flex;align-items:center;gap:.8em;padding:0;margin-bottom:.8em}
.st-bogen .sh-h::after{content:"";flex:1;height:1px;background:var(--acc)}
.st-bogen .ing{border-bottom:1px solid var(--acc-soft);gap:.55em}
.st-bogen .step-n{background:transparent;color:var(--acc-deep);font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.35em;font-weight:600;width:auto;height:auto;border-radius:0;flex-basis:1.3em;margin-top:-.2em;justify-content:flex-start}
.st-bogen .sh-tipbox{background:#fff;border-radius:1.2em;padding:.85em 1.05em}
.st-bogen .notes-line{border-bottom-color:var(--acc-soft)}
.st-bogen .sh-src{text-align:center;color:#7e7a70}

/* Stil: Pastell */
.st-pastell{color:#443d4b}
.st-pastell .sh-head{background:var(--acc-pale);border-radius:1.4em;padding:1.4em 1.2em 1.15em;text-align:center;position:relative;margin-top:.5em;margin-bottom:1.4em}
.st-pastell .tape{position:absolute;top:-.7em;left:50%;width:7.5em;height:1.45em;margin-left:-3.75em;background:var(--acc-soft);opacity:.9;transform:rotate(-3deg);border-radius:.15em}
.st-pastell .sh-cat{color:var(--acc-deep);letter-spacing:.24em;font-size:.68em;font-weight:800}
.st-pastell .sh-title{font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;font-size:3em;line-height:1.05;letter-spacing:0;color:var(--acc-deep)}
.st-pastell .mi{border:1.5px solid var(--acc-soft);border-radius:999px;padding:.28em .85em .28em .65em}
.st-pastell .sh-h{display:inline-block;background:var(--acc-soft);color:var(--acc-deep);border:0;border-radius:999px;padding:.32em 1.05em;font-weight:800;font-size:.7em;letter-spacing:.2em;margin-bottom:.75em}
.st-pastell .ing::before{content:"";flex:0 0 .8em;height:.8em;border:1.5px solid var(--acc);border-radius:50%;transform:translateY(.1em)}
.st-pastell .step-n{background:#fff;border:1.5px solid var(--acc);color:var(--acc-deep);font-weight:800}
.st-pastell .sh-photo{border-radius:1.2em}
.st-pastell .sh-tipbox{border:1.5px dashed var(--acc);border-radius:1.2em;padding:.8em 1em}
.st-pastell .notes-line{border-bottom:1.5px dashed var(--acc-soft)}
.st-pastell .sh-src{text-align:center}
</style>

function normTpl(t){
  const o={id:t.id,name:t.name||'Vorlage',style:STYLES[t.style]?t.style:'blush',columns:t.columns==2?2:1,paper:PAPER[t.paper]?t.paper:'A4',

    customFields:Array.isArray(t.customFields)?t.customFields.filter(f=>f&&f.key).map(f=>({key:f.key,label:f.label||f.key,hint:f.hint||''})):[],
    sections:Array.isArray(t.sections)?t.sections.filter(s=>s&&s.key).map(s=>({key:s.key,label:s.label||'',on:s.on!==false,col:s.col==='a'?'a':'b'})):[],
    createdAt:t.createdAt||0,_virtual:!!t._virtual,titleFont:TITLE_FONTS[t.titleFont]?t.titleFont:'',paperColor:/^#[0-9a-f]{6}$/i.test(t.paperColor||'')?t.paperColor:''};
  const keys=new Set(o.sections.map(s=>s.key));
  for(const b of BASE_SECTIONS)if(!keys.has(b.key))o.sections.push({key:b.key,label:b.label,on:false,col:b.col});
  for(const f of o.customFields)if(!keys.has('x:'+f.key))o.sections.push({key:'x:'+f.key,label:f.label,on:true,col:'a'});
  o.sections=o.sections.filter(s=>!s.key.startsWith('x:')||o.customFields.some(f=>'x:'+f.key===s.key));
  return o;
}

function photoSrc(r){return r._photoUrl||(r.photoId?(IMG.get(r.photoId)||''):'');}
function hasPhoto(r){return !!(r._photoUrl||r.photoId);}
function bgAttr(r){const u=photoSrc(r);return u?`style="background-image:url('${esc(u)}')"`:(r.photoId?`data-bg="${esc(r.photoId)}"`:'');}
function ingLine(line){
  line=String(line).trim();
  if(/:$/.test(line)||/^#/.test(line))return `<div class="ing-g">${esc(line.replace(/^#+\s*/,'').replace(/:$/,''))}</div>`;
  const m=line.match(QTY_RE);
  if(m)return `<div class="ing"><span class="ing-a">${esc(m[1].trim())}</span><span class="ing-i">${esc(m[2])}</span></div>`;
  return `<div class="ing"><span class="ing-a"></span><span class="ing-i">${esc(line)}</span></div>`;
}
function sectionHtml(s,r,t){
  const H=`<h2 class="sh-h"><span>${esc(s.label)}</span></h2>`;
  const k=s.key;
  if(k==='photo')return hasPhoto(r)?`<div class="sh-sec"><div class="sh-photo" ${bgAttr(r)}></div></div>`:'';
  if(k==='intro')return r.intro?`<div class="sh-sec"><p class="sh-intro">${nl2br(r.intro)}</p></div>`:'';
  if(k==='meta'){
    const it=[['Portionen',r.servings,'servings'],['Vorbereitung',r.prepTime,'clock'],['Koch-/Backzeit',r.cookTime,'pot'],['Gesamtzeit',r.totalTime,'clock'],['Schwierigkeit',r.difficulty,'heart']].filter(x=>str(x[1]));
    const ic=t&&PLAYFUL.includes(t.style);const col=t?darken(t.accent):'#555';
    return it.length?`<div class="sh-sec"><div class="sh-meta">${it.map(([l,v,k])=>`<div class="mi">${ic?icon(k,col):''}<span class="ml">${l}</span><span class="mv">${esc(v)}</span></div>`).join('')}</div></div>`:'';
  }
  if(k==='ingredients'){const L=(r.ingredients||[]).filter(x=>String(x).trim());return L.length?`<div class="sh-sec">${H}<div class="ings">${L.map(ingLine).join('')}</div></div>`:'';}
  if(k==='steps'){const L=(r.steps||[]).filter(x=>String(x).trim());return L.length?`<div class="sh-sec">${H}${L.map((t,i)=>`<div class="step"><span class="step-n">${i+1}${''}</span><div class="step-t">${esc(t)}</div></div>`).join('')}</div>`:'';}
  if(k==='nutrition'){const n=r.nutrition||{};const it=[['kcal',n.kcal],['Eiweiß',n.protein],['Kohlenhydr.',n.carbs],['Fett',n.fat]].filter(x=>str(x[1]));return it.length?`<div class="sh-sec">${H}<div class="nut">${it.map(([l,v])=>`<div><b>${esc(v)}</b><small>${l}</small></div>`).join('')}</div></div>`:'';}
  if(k==='tips')return str(r.tips)?`<div class="sh-sec sh-tipbox">${H}<div class="sh-text">${nl2br(r.tips)}</div></div>`:'';
  if(k==='notes')return `<div class="sh-sec">${H}${'<div class="notes-line"></div>'.repeat(5)}</div>`;
  if(k==='source')return str(r.source)?`<div class="sh-sec sh-src">${esc(s.label)}: ${esc(r.source)}</div>`:'';
  if(k.startsWith('x:')){const v=str(r.extra&&r.extra[k.slice(2)]);return v?`<div class="sh-sec">${H}<div class="sh-text">${nl2br(v)}</div></div>`:'';}
  return '';
}
function renderSheet(r,t){

    const a=secs.filter(s=>s.col==='a').map(s=>sectionHtml(s,r,t)).join('');
    const b=secs.filter(s=>s.col!=='a').map(s=>sectionHtml(s,r,t)).join('');
    body=`<div class="cols"><div class="col col-a">${a}</div><div class="col col-b">${b}</div></div>`;
  }else body=secs.map(s=>sectionHtml(s,r,t)).join('');

}
function previewHtml(r,t){return `<div class="preview"><div class="pv-frame"><div class="pv-scale">${renderSheet(r,t)}</div></div></div>`;}
function mountPreviews(){
  $$('.pv-frame').forEach(fr=>{
    const sheet=$('.sheet',fr);if(!sheet)return;
    const box=fr.parentElement;const cs=getComputedStyle(box);
    const avail=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const w=sheet.offsetWidth,h=sheet.offsetHeight,s=Math.min(1,avail/w);
    $('.pv-scale',fr).style.transform=`scale(${s})`;fr.style.width=(w*s)+'px';fr.style.height=(h*s)+'px';
    $$('.pb',sheet).forEach(e=>e.remove());
    const P=PAPER[sheet.dataset.paper]||PAPER.A4;const m=P.pad*.75;
    let y=P.h-m,k=2;
    while(y<h-24){const d=document.createElement('div');d.className='pb';d.style.top=y+'px';d.innerHTML=`<span>≈ Seite ${k}</span>`;sheet.appendChild(d);y+=P.h-2*m;k++;}
  });
}

/* Editor */
function ensureRecipe(r){
  r.ingredients=Array.isArray(r.ingredients)?r.ingredients:[];r.steps=Array.isArray(r.steps)?r.steps:[];
  r.tags=Array.isArray(r.tags)?r.tags:[];r.extra=r.extra&&typeof r.extra==='object'?r.extra:{};r.nutrition=r.nutrition&&typeof r.nutrition==='object'?r.nutrition:{};
  r.screenshotIds=Array.isArray(r.screenshotIds)?r.screenshotIds:[];return r;
}

async function makeTiles(srcs){

    const img=await loadImg(src);const W=img.naturalWidth,H=img.naturalHeight;
    const tileH=Math.round(W*1.9),overlap=Math.round(W*.1);
    const parts=[];if(H<=tileH*1.15)parts.push([0,H]);else for(let y=0;y<H;y+=tileH-overlap){const h=Math.min(tileH,H-y);parts.push([y,h]);if(y+h>=H)break;}

async function cropPhoto(canvas,box){
  if(!Array.isArray(box)||box.length!==4)return null;
  let [x0,y0,x1,y1]=box.map(Number);if([x0,y0,x1,y1].some(v=>!isFinite(v)))return null;

function waitImgs(el){const urls=[];$$('[style*="background-image"]',el).forEach(n=>{const m=/url\(["']?([^"')]+)/.exec(n.style.backgroundImage);if(m)urls.push(m[1]);});

function rowBlank(d,off,W,bg){for(let x=0;x<W;x+=3){const i=off+x*4;if(Math.abs(d[i]-bg[0])>8||Math.abs(d[i+1]-bg[1])>8||Math.abs(d[i+2]-bg[2])>8)return false;}return true;}
function findBreak(ctx,W,from,minY,bg){
  const h=from-minY;if(h<4)return from;
  const data=ctx.getImageData(0,minY,W,h).data;
  for(let row=h-1;row>=0;row--)if(rowBlank(data,row*W*4,W,bg))return minY+row;

function paginate(canvas,P){
  const W=canvas.width,k=W/P.w,pageH=Math.round(P.h*k),m=Math.round(P.pad*.75*k),ctx=canvas.getContext('2d',{willReadFrequently:true});
  const bgd=ctx.getImageData(2,canvas.height-3,1,1).data;const bg=[bgd[0],bgd[1],bgd[2]];
  const out=[];let y=0,first=true;
  while(y<canvas.height-4){
    const top=first?0:m;const rest=canvas.height-y;let end;
    if(rest<=pageH-top-(first?0:m*.5))end=canvas.height;
    else{const lim=y+pageH-top-m;end=findBreak(ctx,W,lim,Math.round(y+(pageH-top-m)*.65),bg);}
    if(end<=y)end=Math.min(canvas.height,y+pageH-top-m);
    const pc=document.createElement('canvas');pc.width=W;pc.height=pageH;const p=pc.getContext('2d');p.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;p.fillRect(0,0,W,pageH);
    p.drawImage(canvas,0,y,W,end-y,0,top,W,end-y);out.push(pc.toDataURL('image/jpeg',.9));
    y=end;first=false;
    let skip=0;while(y<canvas.height&&skip<m){const d=ctx.getImageData(0,y,W,1).data;if(!rowBlank(d,0,W,bg))break;y++;skip++;}
  }

/* ---------- Was hab ich da? ---------- */
const IRREG={eier:'ei'};
const STAPLES=['salz','pfeffer','wasser','ol','eiswurfel'];
function normW(w){return String(w).toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/[^a-z]/g,'');}
function stemW(w){w=normW(w);if(IRREG[w])return IRREG[w];for(const x of ['en','n','e','s'])if(w.length>4&&w.endsWith(x))return w.slice(0,-x.length);return w;}
function coreWord(part){
  const t=part.replace(/\([^)]*\)/g,' ').split(',')[0].trim();
  const words=t.split(/\s+/).filter(w=>/[A-Za-zÄÖÜäöüß]/.test(w));if(!words.length)return '';
  const caps=words.filter(w=>/^[A-ZÄÖÜ]/.test(w));
  return (caps.length?caps[caps.length-1]:words[words.length-1]).replace(/[^A-Za-zÄÖÜäöüß-]/g,'');
}
function recipeReqs(r){
  const out=[];let opt=false;
  for(const raw of r.ingredients||[]){
    const line=String(raw).trim();if(!line)continue;
    if(/:$/.test(line)||/^#/.test(line)){opt=/optional|servier|garni|deko|belieben|topping|beilage|wunsch/i.test(line);continue;}
    const m=line.match(QTY_RE);const body=m?m[2]:line;
    const lineOpt=opt||/optional|nach belieben|zum garnieren|nach wunsch|zum servieren/i.test(line);
    for(const part of body.split(/\s+und\s+|\s*&\s*/)){
      const alts=part.split(/\s+oder\s+|\s*\/\s*/).map(coreWord).filter(Boolean);
      if(alts.length)out.push({label:alts.join(' oder '),alts:alts.map(stemW).filter(Boolean),optional:lineOpt});
    }
  }
  return out;
}
function hit(c,t){if(!c||!t)return false;if(c===t)return true;if(t.length>=2&&c.endsWith(t))return true;if(c.length>=3&&t.endsWith(c))return true;if(t.length>=4&&c.startsWith(t))return true;if(c.length>=4&&t.startsWith(c))return true;return false;}
function analyze(r,terms,staples){
  let have=0,total=0,used=0;const missing=[];
  for(const q of recipeReqs(r)){
    const byUser=q.alts.some(a=>terms.some(t=>hit(a,t)));
    const bySt=staples&&q.alts.some(a=>STAPLES.some(x=>hit(a,x)));
    if(q.optional){if(byUser)used++;continue;}
    total++;
    if(byUser||bySt){have++;if(byUser)used++;}else missing.push(q.label);
  }
  return {have,total,used,missing};
}
function pantryKey(){return JSON.stringify([S.pantry.items.map(normW).sort(),S.pantry.staples]);}
function addPantry(v,keepFocus=true){
  const parts=String(v||'').split(/[,;\n]/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean);
  for(const x of parts)if(!S.pantry.items.some(y=>normW(y)===normW(x)))S.pantry.items.push(x.charAt(0).toUpperCase()+x.slice(1));
  S.pantry.ai=null;savePantry();S.pantry.focus=keepFocus;render();
}
function pantrySuggestions(){
  const freq=new Map();const have=S.pantry.items.map(stemW).filter(Boolean);
  for(const r of S.recipes)for(const q of recipeReqs(r))for(const [i,a] of q.alts.entries()){
    if(!a||have.some(t=>hit(a,t))||STAPLES.some(x=>hit(a,x)))continue;
    const label=q.label.split(' oder ')[i]||q.label;const e=freq.get(a)||{label,n:0};e.n++;freq.set(a,e);
  }
  return [...freq.values()].sort((x,y)=>y.n-x.n||coll.compare(x.label,y.label)).slice(0,18).map(e=>e.label);
}
function presHtml(r,a,tip){
  const h=hueOf(r.category);const src=photoSrc(r);const pct=a.total?Math.round(a.have/a.total*100):0;
  return `<button class="pres" data-act="open" data-id="${esc(r.id)}" style="--h:${h}"><div class="pres-th" ${bgAttr(r)}>${src?'':`<b>${esc(r.title||'')}</b>`}</div>

    <div class="bar ${a.missing.length?'':'full'}"><span style="width:${pct}%"></span></div><span class="pres-n">${a.have} von ${a.total} Zutaten da</span>
    ${a.missing.length?`<div class="miss">Es fehlt: ${a.missing.map(x=>`<em>${esc(x)}</em>`).join('')}</div>`:'<div class="allok">Alles da, du kannst loslegen</div>'}

}

function newId(){try{if(crypto.randomUUID)return crypto.randomUUID().replace(/-/g,'');}catch(_){}return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
const IDB={db:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('rezeptkartei',1);}catch(e){rej(e);return;}
    r.onupgradeneeded=()=>{const d=r.result;for(const n of ['recipes','templates'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});for(const n of ['kv','images'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n);};
    r.onsuccess=()=>{IDB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>{out=q.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  all(st){return IDB.tx(st,'readonly',s=>s.getAll());},
  get(st,k){return IDB.tx(st,'readonly',s=>s.get(k));},
  put(st,v,k){return IDB.tx(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k));},
  del(st,k){return IDB.tx(st,'readwrite',s=>s.delete(k));}
};
const Store={recipes:new Map(),templates:new Map(),settings:null,listeners:{recipes:[],templates:[],'settings/app':[]}};
function collSnap(name){const docs=[...Store[name].values()].map(v=>({id:v.id,exists:true,data:()=>{const o=clone(v);delete o.id;return o;}}));return {docs,size:docs.length,empty:!docs.length};}
function settingsSnap(){return {id:'app',exists:!!Store.settings,data:()=>Store.settings?clone(Store.settings):undefined};}
function notify(key){for(const cb of Store.listeners[key]||[])try{cb(key==='settings/app'?settingsSnap():collSnap(key));}catch(e){console.error(e);}}
function docRef(c,id){
  if(c==='settings')return {id,
    async set(body){Store.settings=clone(body);await IDB.put('kv',Store.settings,'settings');syncPush('settings','app',Store.settings);notify('settings/app');},
    async update(p){Store.settings={...(Store.settings||{}),...clone(p)};await IDB.put('kv',Store.settings,'settings');syncPush('settings','app',Store.settings);notify('settings/app');},
    async delete(){Store.settings=null;await IDB.del('kv','settings');notify('settings/app');}};
  return {id,
    async set(body){const v={...clone(body),id};await IDB.put(c,v);Store[c].set(id,v);syncPush(c,id,v);notify(c);},
    async update(p){const cur=Store[c].get(id);if(!cur)throw {code:'invalid_argument'};const v={...cur,...clone(p),id};await IDB.put(c,v);Store[c].set(id,v);syncPush(c,id,v);notify(c);},
    async delete(){await IDB.del(c,id);Store[c].delete(id);syncPush(c,id,null);notify(c);}};

db={
  collection(name){return {doc:(id)=>docRef(name,id||newId()),onSnapshot(cb){Store.listeners[name].push(cb);setTimeout(()=>cb(collSnap(name)),0);return()=>{};}};},
  doc(path){const [c,id]=path.split('/');const ref=docRef(c,id);ref.onSnapshot=(cb)=>{Store.listeners[path].push(cb);setTimeout(()=>cb(settingsSnap()),0);return()=>{};};return ref;}
};

async function shrinkImage(blob,maxW=1400){

    const k=Math.min(1,maxW/img.naturalWidth,14000/img.naturalHeight);const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);

}

function parseLoose(t){

function httpErr(status,msg){

  if(status===404)return {code:'model',message:msg};

function textToRecipe(text,t,U){

  const isTip=l=>/^(tipps?|hinweis|notiz|varianten?|notes?)\b/i.test(l);
  let mode='head';const head=[],ing=[],steps=[],tips=[];
  for(const l of lines){if(isIng(l)){mode='ing';continue;}if(isStep(l)){mode='step';continue;}if(isTip(l)){mode='tip';continue;}
    (mode==='head'?head:mode==='ing'?ing:mode==='step'?steps:tips).push(l);}
  const st=[];for(const l of steps){const m=l.match(/^(?:schritt\s*)?(\d+)[.):]?\s+(.*)/i);if(m||!st.length||/[.!:]$/.test(st[st.length-1]))st.push(m?m[2]:l);else st[st.length-1]+=' '+l;}

      if(name==='recipes')for(const im of [old.photoId,...(old.screenshotIds||[])])if(im){tasks.push(IDB.del('images',im).catch(()=>{}));const u=IMG.get(im);if(u)URL.revokeObjectURL(u);IMG.delete(im);}
    }else{
      const v={...ch.doc.data(),id};const old=Store[name].get(id);
      if(old&&JSON.stringify({...old,_ts:0})===JSON.stringify({...v,_ts:0}))continue;
      Store[name].set(id,v);tasks.push(IDB.put(name,v));changed=true;
    }
  }
  Promise.all(tasks).catch(()=>{});
  if(changed)notify(name);
}
async function syncMergeUp(){
  const {collection,getDocs,getDoc}=SYNC.api;
  const [rs,ts,ss]=await Promise.all([getDocs(collection(SYNC.fs,'karteien',SYNC.code,'rezepte')),getDocs(collection(SYNC.fs,'karteien',SYNC.code,'vorlagen')),getDoc(cloudRef('settings','app'))]);
  const cr=new Set(rs.docs.map(d=>d.id)),ct=new Set(ts.docs.map(d=>d.id));
  const cloudHasOwn=rs.docs.some(d=>!(d.data()||{}).example);
  for(const r of [...Store.recipes.values()]){
    if(cr.has(r.id))continue;
    if(r.example&&cloudHasOwn){Store.recipes.delete(r.id);await IDB.del('recipes',r.id).catch(()=>{});notify('recipes');continue;}
    syncPush('recipes',r.id,r);

  }
  for(const t of Store.templates.values())if(!ct.has(t.id))syncPush('templates',t.id,t);
  if(!ss.exists()&&Store.settings)syncPush('settings','app',Store.settings);
  else if(ss.exists()){const v=ss.data();Store.settings=v;await IDB.put('kv',v,'settings');notify('settings/app');}
}
async function syncStart(){
  if(!SYNC.code)return;
  if(!fbConfig()){setSync('error','Firebase ist noch nicht eingerichtet.');return;}
  const gen=++SYNC.gen;setSync('connecting');
  try{
    await loadFirebase();if(gen!==SYNC.gen)return;
    SYNC.on=true;
    for(const [k,v] of [...IMG])if(!v)IMG.delete(k);
    if(!(await IDB.get('kv','merged:'+SYNC.code))){await syncMergeUp();await IDB.put('kv',true,'merged:'+SYNC.code);}
    syncSubscribe(gen);
    setSync('ok');render();
  }catch(e){if(gen!==SYNC.gen)return;SYNC.on=!!SYNC.api;setSync('error',syncErrText(e));if(SYNC.api&&!SYNC.unsubs.length)syncSubscribe(gen);}
}
function syncSubscribe(gen){
  const {collection,onSnapshot}=SYNC.api;const err=e=>{if(gen===SYNC.gen)setSync('error',syncErrText(e));};
  SYNC.unsubs.forEach(u=>{try{u();}catch(_){}});SYNC.unsubs=[];
  const ok=()=>{if(gen===SYNC.gen&&SYNC.state!=='ok'){SYNC.state='ok';SYNC.msg='';updateSyncPill();}};
  SYNC.unsubs.push(onSnapshot(collection(SYNC.fs,'karteien',SYNC.code,'rezepte'),s=>{applyCloud('recipes',s);ok();},err));
  SYNC.unsubs.push(onSnapshot(collection(SYNC.fs,'karteien',SYNC.code,'vorlagen'),s=>{applyCloud('templates',s);ok();},err));
  SYNC.unsubs.push(onSnapshot(cloudRef('settings','app'),s=>{if(!s.exists())return;const v=s.data();if(JSON.stringify(v)===JSON.stringify(Store.settings))return;Store.settings=v;IDB.put('kv',v,'settings').catch(()=>{});notify('settings/app');},err));
}

function parseFbConfig(t){

  try{const o=JSON.parse(j);return o.apiKey&&o.projectId&&o.appId?o:null;}catch(_){return null;}
}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfToBlob(file){
  await loadScript(PDFJS+'pdf.min.js');
  const lib=window.pdfjsLib;if(!lib)throw new Error('pdf');
  try{lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';}catch(_){}
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const page=await doc.getPage(1);const v1=page.getViewport({scale:1});
  const scale=Math.min(3,1500/Math.max(v1.width,v1.height));const vp=page.getViewport({scale});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;
  return canvasBlob(c,'image/jpeg',.9);
}
async function fitImage(blob,max=1500){
  const u=URL.createObjectURL(blob);try{const img=await loadImg(u);const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return {blob:await canvasBlob(c,'image/jpeg',.9),w:c.width,h:c.height};}finally{URL.revokeObjectURL(u);}
}
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return (0.2126*r+0.7152*g+0.0722*b)/255;}
async function importTplDesign(file){
  if(!AI.key){S.tplImport={err:true,msg:'Zum Nachbauen braucht die App einen KI-Schlüssel (Gemini ist kostenlos). Trag ihn unter „Mehr“ ein.'};render();return;}

Antworte NUR mit JSON in genau dieser Form:
{"name":"","style":"","columns":1,"paper":"A5","accent":"#RRGGBB","paperColor":"","titleFont":"","fontScale":1,"showCategory":true,"showTags":false,"sections":[{"key":"","label":"","on":true,"col":"a"}],"customFields":[{"label":"","hint":""}]}

- name: kurzer, hübscher Name für die Vorlage (2–3 Wörter, deutsch).
- style: der ähnlichste Grundstil:
  blush = verspielt, farbiger geschwungener Kopfbereich, Titel in Schreibschrift, Zutaten mit Punkten, Tipp in Handschrift

  pastell = Karte mit Klebestreifen-Optik, Kreise zum Abhaken, Überschriften in Pillen
  modern = klar und sachlich, Großbuchstaben-Überschriften mit Linie

  karte = Karteikarte mit Linien und Schreibmaschinenschrift
- columns: 2, wenn Zutaten und Zubereitung nebeneinander stehen, sonst 1.
- paper: "A5q" bei Querformat, sonst "A5".
- accent: die prägende Akzentfarbe (Überschriften, Linien, Deko) als Hex-Wert.
- paperColor: Hintergrundfarbe des Papiers als Hex-Wert, nur wenn deutlich nicht weiß, sonst "".
- titleFont: "script" (Schreibschrift), "serif" (Serif kursiv), "sans" (schlicht modern), "slab" (Slab/Schreibmaschine), "hand" (Handschrift) oder "" wenn der Grundstil passt.
- fontScale: 0.9 bei viel kleinem Text, 1.1 bei großer Schrift, sonst 1.
- sections: ALLE diese Bereiche genau einmal, in der Reihenfolge wie im Vorbild von oben nach unten (bei zwei Spalten erst die linke, dann die rechte): photo (Foto), intro (Beschreibung), meta (Portionen/Zeiten/Schwierigkeit), ingredients (Zutaten), steps (Zubereitung), nutrition (Nährwerte), tips (Tipps), notes (leere Linien für Notizen), source (Quelle). on=false für Bereiche, die das Vorbild nicht hat. col: "a" = linke Spalte, "b" = rechte Spalte (bei einer Spalte egal). label: die Überschrift wie im Vorbild, auf Deutsch (z. B. "Das brauchst du", "So geht's").
- customFields: Felder des Vorbilds, die es oben nicht gibt (z. B. "Weinempfehlung", "Für wen", "Haltbarkeit", "Mein Fazit"), jeweils mit kurzem Hinweis, was dort stehen soll. Leere Liste, wenn es keine gibt.`;
  try{

      titleFont:TITLE_FONTS[o.titleFont]?o.titleFont:'',fontScale:[0.9,1,1.1].reduce((a,b)=>Math.abs(b-(+o.fontScale||1))<Math.abs(a-(+o.fontScale||1))?b:a),
      showCategory:o.showCategory!==false,showTags:!!o.showTags,customFields:[],sections:[],createdAt:Date.now()};
    const seen=new Set();
    for(const x of Array.isArray(o.sections)?o.sections:[]){const b=BASE_SECTIONS.find(y=>y.key===x.key);if(!b||seen.has(b.key))continue;seen.add(b.key);t.sections.push({key:b.key,label:str(x.label)||b.label,on:x.on!==false,col:x.col==='a'?'a':'b'});}
    for(const f of Array.isArray(o.customFields)?o.customFields:[]){const label=str(f&&f.label);if(!label)continue;let key=slug(label),n=2;const k0=key;while(t.customFields.some(c=>c.key===key)||BASE_SECTIONS.some(y=>y.key===key))key=k0+'-'+(n++);
      t.customFields.push({key,label,hint:str(f.hint)});t.sections.push({key:'x:'+key,label,on:true,col:t.columns===2?'a':'b'});}

      await IDB.put('kv',true,'initialized');
    }
    const [recs,tpls,settings,ai,lastExport]=await Promise.all([IDB.all('recipes'),IDB.all('templates'),IDB.get('kv','settings'),IDB.get('kv','ai'),IDB.get('kv','lastExport')]);
    for(const r of recs)Store.recipes.set(r.id,r);for(const t of tpls)Store.templates.set(t.id,t);Store.settings=settings||null;
    loadAiStored(ai);S.lastExport=lastExport||0;
    const [sy,cfg]=await Promise.all([IDB.get('kv','sync'),IDB.get('kv','fbcfg')]);SYNC.code=(sy&&sy.code)||'';SYNC.config=cfg||null;
    try{if(navigator.storage&&navigator.storage.persisted)S.persisted=await navigator.storage.persisted();}catch(_){}
  }catch(e){S.noDb=true;render();return;}
  let got={r:false,t:false};
  const ready=()=>{if(got.r&&got.t)S.loaded=true;};
  const onData=()=>{ready();setTimeout(migrateCats,0);if(['library','detail','upload','settings'].includes(S.view)||(S.view==='pantry'&&document.activeElement?.id!=='pin'))render();else if(S.view==='templates'&&!S.tplDirty)render();};
  db.collection('recipes').onSnapshot(s=>{S.recipes=s.docs.map(d=>ensureRecipe({id:d.id,...clone(d.data())}));got.r=true;onData();});
  db.collection('templates').onSnapshot(s=>{S.templates=s.docs.map(d=>({id:d.id,...clone(d.data())}));got.t=true;onData();});
  db.doc('settings/app').onSnapshot(s=>{const v=s.exists?s.data():{};S.settings={categories:Array.isArray(v.categories)&&v.categories.length?v.categories.slice():DEFAULT_CATS.slice(),defaultTemplateId:v.defaultTemplateId||null};onData();});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  const hm=location.hash.match(/kartei=([A-Za-z0-9-]+)/);
  if(hm){S.joinCode=normCode(hm[1]);try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}if(!SYNC.code){S.view='settings';render();}}
  updateSyncPill();if(SYNC.code)syncStart();
})();
</script>
